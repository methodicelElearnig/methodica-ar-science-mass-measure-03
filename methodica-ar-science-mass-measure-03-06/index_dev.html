<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>DEV — מדעים יעד 3 | סיין 6</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; }
    #lomdah-frame {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: calc(100vw - 100px); height: 100vh; border: none; display: block;
    }

    #dev-panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: 100px;
      background: rgba(0,0,0,0.92); border-left: 2px solid #ffe600;
      z-index: 9999; display: flex; flex-direction: column;
      font-family: monospace; color: #fff; user-select: none;
    }
    #dev-header {
      flex-shrink: 0; padding: 10px 6px; border-bottom: 1px solid #333; text-align: center;
    }
    #dev-label { display: block; color: #ffe600; font-weight: 700; font-size: 11px; letter-spacing: 1px; }
    #dev-hint { display: block; color: #666; font-size: 8px; margin-top: 6px; line-height: 1.4; }

    #dev-list {
      flex: 1 1 auto; overflow-y: auto; padding: 8px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .dev-item {
      display: flex; align-items: center; justify-content: center; width: 100%;
      background: transparent; border: 1px solid #333; color: #ddd;
      border-radius: 8px; padding: 8px 0;
      cursor: pointer; font-size: 15px; font-family: monospace; font-weight: 700;
    }
    .dev-item:hover { border-color: #ffe600; color: #fff; }
    .dev-item.active { background: #ffe600; color: #000; border-color: #ffe600; }

    #dev-footer {
      flex-shrink: 0; padding: 8px; border-top: 1px solid #333;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    #dev-footer-btns { display: flex; gap: 6px; }
    #dev-footer button {
      background: transparent; border: 1px solid #ffe600; color: #ffe600;
      border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 13px;
    }
    #dev-footer button:hover { background: #ffe600; color: #000; }
    #dev-footer button:disabled { opacity: 0.3; cursor: default; }
    #dev-total { color: #aaa; font-size: 11px; }
  </style>
</head>
<body>
  <iframe id="lomdah-frame" src="index.html"></iframe>

  <div id="dev-panel">
    <div id="dev-header">
      <span id="dev-label">DEV — ניווט מסכים</span>
      <span id="dev-hint">Ctrl+← / Ctrl+→ לדפדוף</span>
    </div>

    <div id="dev-list"></div>

    <div id="dev-footer">
      <span id="dev-total">0 / 0</span>
      <div id="dev-footer-btns">
        <!-- RTL: next (◀) on LEFT, prev (▶) on RIGHT -->
        <button id="btn-next" onclick="devNext()" title="מסך הבא (Ctrl+←)">◀</button>
        <button id="btn-prev" onclick="devPrev()" title="מסך קודם (Ctrl+→)">▶</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';
    const frame      = document.getElementById('lomdah-frame');
    const listEl     = document.getElementById('dev-list');
    const totalLabel = document.getElementById('dev-total');
    const btnPrev    = document.getElementById('btn-prev');
    const btnNext    = document.getElementById('btn-next');

    let devCurrent = 0;   // 0-based, תואם ל-data-screen הפנימי
    let TOTAL      = 0;   // יעודכן אוטומטית מ-DEV_READY ברגע שנוסף מסך ראשון

    function renderList() {
      listEl.innerHTML = '';
      for (let i = 0; i < TOTAL; i++) {
        const item = document.createElement('button');
        item.className = 'dev-item' + (i === devCurrent ? ' active' : '');
        item.textContent = i + 1;
        item.title = 'מסך ' + (i + 1);
        item.onclick = () => devGoTo(i);
        listEl.appendChild(item);
      }
    }

    // Receive actual screen count from script.js via DEV_READY
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'DEV_READY') {
        TOTAL = e.data.total || TOTAL;
        renderList();
        updateUI();
      }
    });

    frame.addEventListener('load', () => {
      devCurrent = 0;
      renderList();
      updateUI();
    });

    function devGoTo(n) {
      n = Math.max(0, Math.min(TOTAL - 1, n));
      frame.contentWindow.postMessage({ type: 'DEV_GOTO', screen: n }, '*');
      devCurrent = n;
      updateUI();
    }
    function devNext() { devGoTo(devCurrent + 1); }
    function devPrev() { devGoTo(devCurrent - 1); }

    function updateUI() {
      totalLabel.textContent = (devCurrent + 1) + ' / ' + TOTAL;
      btnPrev.disabled = (devCurrent <= 0);
      btnNext.disabled = (devCurrent >= TOTAL - 1);
      listEl.querySelectorAll('.dev-item').forEach((el, i) => {
        el.classList.toggle('active', i === devCurrent);
      });
      const activeItem = listEl.children[devCurrent];
      if (activeItem) activeItem.scrollIntoView({ block: 'nearest' });
    }

    // RTL keyboard: Ctrl+← = forward (next), Ctrl+→ = backward (prev)
    window.addEventListener('keydown', (e) => {
      if (!e.ctrlKey) return;
      if (e.key === 'ArrowLeft')  { e.preventDefault(); devNext(); }
      if (e.key === 'ArrowRight') { e.preventDefault(); devPrev(); }
    });

    renderList();
    updateUI();
  </script>
</body>
</html>
